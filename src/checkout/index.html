<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>
    <script src="../js/checkout.js" type="module"></script>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header class="divider" id="main-header">
    </header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
        <form name="checkout">
          <input type="hidden" name="orderDate" id="orderdate">
          <fieldset>
            <legend></legend>
              <div class="CheckoutCustomerName">
                <label for="fname">First Name</label>
                <input type="text" name="fname" id="fname">
                <label for="lname">Last Name</label>
                <input type="text" name="lname" id="lname">
              </div>
              <div class="CheckoutDeliverAdress">

                <label for="street">Street Address</label>
                <input type="text" name="street" id="street">
                <label for="city">City</label>
                <input type="text" name="city" id="city">
                <label for="state">State</label>
                <input type="text" name="state" id="state">
                <label for="zip">Zip Code</label>
                <input type="text" name="zip" id="zip">
              </div>
              <legend>Payment</legend>
              <div class="CheckoutPayment">
                <label for="cardNumber">Credit Card Number</label>
                <input name="cardNumber" id="cardNumber" required inputmode="numeric" autocomplete="cc-number" >
                <label for="expiration">Expiration Date</label>
                <input id="expiration" name="expiration" required placeholder="MM/YY" autocomplete="cc-exp" />
                <label for="code">Security Code</label>
                <input id="code" name="code" required inputmode="numeric" autocomplete="cc-csc" />
              </div>
          </fieldset>
          <fieldset class="checkout-summary">
              <div class="order-summary">
                <div>Subtotal</div>
                <div id="Subtotal"></div>
                <div>Tax</div>
                <div id="Tax"></div>
                <div>Shipping</div>
                <div id="Shipping_Estimate"></div>
                <div>Total</div>
                <div id="Order_Total"></div>
            </div>
          </fieldset>
          <button type="submit" id="submitorder">Checkout</button>
        </form>
      </section>
    </main>

    <footer id="main-footer">
    </footer>
  </body>
</html>
