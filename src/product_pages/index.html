<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Product Name and Make</title>

    <link rel="stylesheet" href="../css/style.css" />

    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header">

    </header>

    <main class="divider">
      <section class="product-detail">
        <h2 id="brandName">Brand</h2>
        <h3 class="divider" id="productName">Product</h3>
        <img
          class="divider"
          src="../images/tents/marmot-ajax-tent-3-person-3-season-in-pale-pumpkin-terracotta~p~880rr_01~320.jpg"
          id="productImage"
          alt="Marmot Ajax tent"
        />

        <p id="productPrice" class="product-card__price">$199.99</p>
        <p id="productColor" class="productColor">color</p>
        <p id="productDesc" class="product__description">product description</p>
        <div class="product-detail__add">
          <button id="addToCart" data-id="productId">Add to Cart</button>
        </div>
      </section>
    </main>

    <footer id="main-footer">
    </footer>
  </body>
</html>
